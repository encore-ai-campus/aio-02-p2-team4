[project]
name = "factlens-backend"
version = "0.1.0"
description = "Incremental True or Not LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "aiohttp>=3.12,<4",
    "playwright>=1.55,<2",
    "asyncpg>=0.30,<1",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
